server.port=8080
spring.application.name=nsm-backend

# Enable Java 21+ Virtual Threads
spring.threads.virtual.enabled=true

# SQLite DataSource Configuration
spring.datasource.url=jdbc:sqlite:nsm.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Live Decoy Honeypot Ports
nsm.probe.enabled=true
nsm.probe.ports=2222,8088,8888,9090

# Background Traffic Simulation
nsm.simulation.enabled=true
