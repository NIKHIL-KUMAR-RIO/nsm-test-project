<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSentinel | SOC Portal Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050811;
            --bg-card: rgba(11, 19, 41, 0.85);
            --border-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --cyan-accent: #38bdf8;
            --cyan-glow: rgba(56, 189, 248, 0.4);
            --emerald-accent: #10b981;
            --rose-accent: #f43f5e;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.15), transparent),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.08), transparent 40%);
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.1);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #10b981);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 1rem;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan-accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 40%, var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
        }

        .alert-error {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fda4af;
        }

        .alert-logout {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: #fff;
            font-family: var(--font-sans);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyan-accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        .credentials-helper {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed rgba(148, 163, 184, 0.2);
        }

        .helper-title {
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .role-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: var(--font-mono);
        }

        .role-btn strong {
            display: block;
            color: var(--cyan-accent);
            font-size: 0.8rem;
            margin-bottom: 0.15rem;
        }

        .role-btn:hover {
            border-color: var(--cyan-accent);
            background: rgba(56, 189, 248, 0.08);
            color: #fff;
        }

        .footer-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <circle cx="12" cy="11" r="3"/>
                </svg>
            </div>
            <h1 class="brand-title">NetSentinel SOC</h1>
            <div class="brand-subtitle">Authentication Gateway // B.Tech IDS</div>
        </div>

        <div id="errorBox" class="alert-box alert-error">
            ⚠️ Invalid credentials. Access denied.
        </div>

        <div id="logoutBox" class="alert-box alert-logout">
            🔒 Logged out successfully. Session closed.
        </div>

        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Administrator Username</label>
                <input class="form-input" type="text" id="username" name="username" placeholder="admin" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Administrator Password</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">
                <span>Access Admin Monitoring Console</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="credentials-helper">
            <div class="helper-title">⚡ Quick-Fill Administrator Account</div>
            <div class="badge-grid" style="grid-template-columns: 1fr;">
                <button type="button" class="role-btn" onclick="fillCreds('admin', 'admin123')">
                    <strong>👑 SOC ADMINISTRATOR</strong>
                    Auto-Fill (admin / admin123) &amp; Enter Console
                </button>
            </div>
        </div>

        <div class="footer-note">
            Role-Based Access Control • Spring Security Hardened
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') !== null) {
            document.getElementById('errorBox').style.display = 'block';
        }
        if (params.get('logout') !== null) {
            document.getElementById('logoutBox').style.display = 'block';
            try { localStorage.removeItem('netsentinel_user'); } catch (_) {}
        }

        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            try {
                localStorage.setItem('netsentinel_user', JSON.stringify({
                    username: 'admin',
                    isAdmin: true,
                    roles: ['ROLE_ADMIN']
                }));
            } catch (_) {}

            if (window.location.protocol === 'file:') {
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginForm').submit();
            }
        }

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                try {
                    localStorage.setItem('netsentinel_user', JSON.stringify({
                        username: 'admin',
                        isAdmin: true,
                        roles: ['ROLE_ADMIN']
                    }));
                } catch (_) {}

                if (window.location.protocol === 'file:') {
                    e.preventDefault();
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
